    <path d="M156 60 L156 252" stroke="white" stroke-width="40" stroke-linecap="round"/>
    <path d="M80 60 L232 60" stroke="white" stroke-width="40" stroke-linecap="round"/>

    <!-- Sparkle/Star accent -->
    <circle cx="280" cy="80" r="16" fill="white" opacity="0.9"/>
    <circle cx="260" cy="120" r="8" fill="white" opacity="0.6"/>
    <circle cx="300" cy="110" r="10" fill="white" opacity="0.7"/>
