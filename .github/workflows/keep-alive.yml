name: keep-alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          URL="${HEALTH_URL:-https://tara-letsgo.vercel.app/api/health}"
          echo "GET $URL"
          BODY=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 15 "$URL")
          echo "status: $BODY"
          cat /tmp/body
          echo
          test "$BODY" = "200"
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
